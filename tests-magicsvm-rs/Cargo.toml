[workspace]

[package]
name = "card-poker-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "associated_token"] }
solana-system-interface = { version = "2", features = ["bincode"] }
card-poker = { path = "../programs/card-poker", features = ["no-entrypoint"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
magicsvm = "0.3.0"
test-utils = { path = "../test-utils/rust", features = ["anchor"] }
solana-address = "~2.6.1"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
